<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony – ZmiennikPrawny</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#005130">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--green:#005130;--mint:#e6f4ed;--paper:#fbfaf7;--ink:#141b17;--muted:#5b6660}
@media (prefers-color-scheme:dark){:root{--paper:#0f1412;--ink:#e8ece9;--muted:#9aa59f;--mint:#143323}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:520px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
.num{font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--green);letter-spacing:.08em;margin:24px 0 8px}
@media (prefers-color-scheme:dark){.num{color:#6fd3a2}}
h1{font:700 clamp(26px,6vw,34px)/1.2 Georgia,"Times New Roman",serif;margin:0 0 12px}
p{color:var(--muted);margin:0 0 28px}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:600}
.primary{background:var(--green);color:#fff}
.primary:hover{background:#003d24}
.secondary{background:var(--mint);color:var(--green)}
@media (prefers-color-scheme:dark){.secondary{color:#6fd3a2}}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="ZmiennikPrawny">
  <div class="num">§ 404</div>
  <h1>Tej strony nie ma w naszym Dzienniku</h1>
  <p>Adres mógł się zmienić albo zawierać literówkę. Nowe akty prawne znajdziesz w aplikacji.</p>
  <div class="links">
    <a class="primary" href="https://app.zmiennikprawny.pl/">Otwórz aplikację</a>
    <a class="secondary" href="/">Strona główna</a>
  </div>
</main>
</body>
</html>
